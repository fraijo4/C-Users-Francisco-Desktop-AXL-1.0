services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axl
      POSTGRES_DB: axl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - axl_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axl -d axl"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  axl_db:
