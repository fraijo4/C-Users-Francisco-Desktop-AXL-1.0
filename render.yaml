services:
  - type: web
    name: axl-transport-dispatch
    runtime: node
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npx tsx scripts/configure-admin.ts && npm run start -- --port "$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
